plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'maven-publish'
}

android {
    namespace 'com.wlmxenl.scaffold'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        resourcePrefix 'scaffold_'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

}

dependencies {
    // AndroidX Activity 版本说明：https://developer.android.com/jetpack/androidx/releases/activity
    api "androidx.activity:activity-ktx:1.8.0"
    // https://developer.android.com/jetpack/androidx/releases/core
    api "androidx.core:core-ktx:1.13.1"
    // https://developer.android.com/jetpack/androidx/releases/appcompat
    api "androidx.appcompat:appcompat:1.7.1"
    // https://developer.android.com/jetpack/androidx/releases/constraintlayout
    api "androidx.constraintlayout:constraintlayout:2.2.1"
    // https://developer.android.com/jetpack/androidx/releases/navigation
    def nav_version = "2.7.7"
    api "androidx.navigation:navigation-fragment-ktx:$nav_version"
    api "androidx.navigation:navigation-ui-ktx:$nav_version"
    // https://developer.android.com/jetpack/androidx/releases/recyclerview
    api 'androidx.recyclerview:recyclerview:1.3.2'

    // https://github.com/liangjingkanji/BRV
    api 'com.github.liangjingkanji:BRV:1.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.wlmxenl.scaffold'
                artifactId = 'library'
                version = rootProject.ext.published_maven_version
            }
        }
    }
}
